name: MySQL Safety Baseline

on:
  pull_request:
    paths:
      - 'Source/Code/TMSrv/wMySQL.cpp'
      - 'Source/Code/TMSrv/wMySQL.h'
      - 'Source/Code/DBSrv/dbMySQL.cpp'
      - 'Source/Code/DBSrv/dbMySQL.h'
      - 'Source/Modern/Platform/Configuration/DatabaseConfig.h'
      - 'tools/ci/Validate-MySqlSafety.ps1'
      - '.github/workflows/mysql-safety.yml'
  push:
    branches:
      - main
      - 'persistence/**'
      - 'security/**'
    paths:
      - 'Source/Code/TMSrv/wMySQL.cpp'
      - 'Source/Code/TMSrv/wMySQL.h'
      - 'Source/Code/DBSrv/dbMySQL.cpp'
      - 'Source/Code/DBSrv/dbMySQL.h'
      - 'Source/Modern/Platform/Configuration/DatabaseConfig.h'
      - 'tools/ci/Validate-MySqlSafety.ps1'
      - '.github/workflows/mysql-safety.yml'

permissions:
  contents: read

jobs:
  static-safety-invariants:
    runs-on: windows-latest

    steps:
      - name: Checkout MySQL safety surface
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Source/Code/TMSrv
            Source/Code/DBSrv
            Source/Modern/Platform/Configuration
            tools/ci

      - name: Validate legacy MySQL safety invariants
        shell: pwsh
        run: ./tools/ci/Validate-MySqlSafety.ps1
