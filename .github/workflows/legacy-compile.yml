name: Legacy C++ Compile Gate

on:
  pull_request:
    paths:
      - 'Source/Code/**'
      - 'Source/Modern/Protocol/**'
      - 'tools/build/**'
      - '.github/workflows/legacy-compile.yml'
  push:
    branches:
      - main
      - 'build/**'
      - 'persistence/**'
      - 'protocol/**'
      - 'observability/**'
    paths:
      - 'Source/Code/**'
      - 'Source/Modern/Protocol/**'
      - 'tools/build/**'
      - '.github/workflows/legacy-compile.yml'

permissions:
  contents: read

jobs:
  compile-release-win32:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout legacy source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Source
            tools/build

      - name: Compile TMSrv and DBSrv without link
        shell: pwsh
        env:
          WYD_ENABLE_PROTOCOL_CONTRACTS: 'true'
        run: |
          $logPath = 'out/legacy/Release/legacy-compile.log'
          New-Item -ItemType Directory -Force -Path (Split-Path $logPath -Parent) | Out-Null
          ./tools/build/Build-Legacy.ps1 -Configuration Release -Project All -CompileOnly *>&1 |
            Tee-Object -FilePath $logPath

      - name: Summarize legacy compiler warnings
        if: always()
        shell: pwsh
        run: ./tools/build/Summarize-LegacyWarnings.ps1 -LogPath out/legacy/Release/legacy-compile.log
