name: Runtime Safety Hotfix Applier

on:
  push:
    branches:
      - build/runtime-safety-hotfix

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: build/runtime-safety-hotfix

      - name: Apply deterministic patch
        run: python tools/build/runtime_safety_hotfix.py

      - name: Verify and commit patched sources
        shell: bash
        run: |
          rm .github/workflows/runtime-safety-hotfix.yml tools/build/runtime_safety_hotfix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Code/TMSrv/ProcessDBMessage.cpp Source/Code/TMSrv/_MSG_MessageWhisper.cpp Source/Code/TMSrv/Server.cpp Source/Code/TMSrv/MobKilled.cpp .github/workflows/runtime-safety-hotfix.yml tools/build/runtime_safety_hotfix.py
          git diff --cached --check
          git commit -m "fix: harden legacy runtime parsing and bounds"
          git push origin HEAD:build/runtime-safety-hotfix
