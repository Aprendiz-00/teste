name: Runtime Safety Hotfix Applier

on:
  push:
    branches:
      - build/runtime-safety-hotfix

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: build/runtime-safety-hotfix
      - name: Validate executor
        run: echo "runtime safety executor ready"
